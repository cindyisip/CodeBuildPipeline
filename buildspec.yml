version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-west-1 | docker login --username AWS --password-stdin 952933884450.dkr.ecr.us-west-1.amazonaws.com
      - IMAGE_TAG=latest
  build:
    commands:
      - echo Building the Docker image...
      - docker build --platform linux/amd64 -t calendly .
      - docker tag calendly:latest 952933884450.dkr.ecr.us-west-1.amazonaws.com/dea8-dev-west1-ecr-calendly-01:$IMAGE_TAG
  post_build:
    commands:
      - echo Pushing the Docker image to ECR...
      - docker push 952933884450.dkr.ecr.us-west-1.amazonaws.com/dea8-dev-west1-ecr-calendly-01:$IMAGE_TAG
      - echo Build completed successfully.

artifacts:
  files: []
